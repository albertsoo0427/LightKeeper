
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .builder { display: grid; grid-template-columns: 290px 1fr; height: 640px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); overflow: hidden; }
  .sidebar { background: var(--color-background-secondary); border-right: 0.5px solid var(--color-border-tertiary); overflow-y: auto; display: flex; flex-direction: column; }
  .sidebar-header { padding: 16px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .brand-name { font-size: 11px; letter-spacing: 0.15em; color: var(--color-text-tertiary); text-transform: uppercase; margin-bottom: 4px; }
  .section-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); }
  .category { padding: 12px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .cat-label { font-size: 11px; letter-spacing: 0.1em; color: var(--color-text-tertiary); text-transform: uppercase; margin-bottom: 8px; }
  .parts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .part-btn { aspect-ratio: 1; border-radius: 6px; border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; padding: 6px; overflow: hidden; }
  .part-btn:hover { border-color: var(--color-border-primary); }
  .part-btn.selected { border: 1.5px solid var(--color-text-primary); }
  .part-btn svg { width: 100%; height: 100%; }
  .ctrl-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .ctrl-label { font-size: 12px; color: var(--color-text-secondary); width: 32px; flex-shrink: 0; }
  .ctrl-row input[type=range] { flex: 1; }
  .ctrl-val { font-size: 12px; color: var(--color-text-primary); min-width: 36px; text-align: right; }
  .canvas-area { background: var(--color-background-primary); display: flex; flex-direction: column; }
  .canvas-header { padding: 12px 20px; border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; justify-content: space-between; }
  .canvas-title { font-size: 13px; color: var(--color-text-secondary); }
  .action-btns { display: flex; gap: 8px; }
  .action-btn { font-size: 12px; padding: 6px 12px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; cursor: pointer; color: var(--color-text-primary); }
  .action-btn:hover { background: var(--color-background-secondary); }
  .canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .tab-row { display: flex; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .tab { flex: 1; padding: 8px; font-size: 12px; color: var(--color-text-secondary); border: none; background: transparent; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--color-text-primary); border-bottom-color: var(--color-text-primary); font-weight: 500; }
  .ctrl-section { display: none; }
  .ctrl-section.active { display: block; }
  .ctrl-group { padding: 12px 16px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .tip { font-size: 11px; color: var(--color-text-tertiary); padding: 12px 16px; line-height: 1.5; }
  .btn-group { display: flex; gap: 6px; }
  .tog-btn { flex: 1; padding: 6px 8px; font-size: 12px; border: 0.5px solid var(--color-border-secondary); border-radius: 6px; background: var(--color-background-primary); cursor: pointer; color: var(--color-text-secondary); transition: all 0.15s; }
  .tog-btn:hover { border-color: var(--color-border-primary); color: var(--color-text-primary); }
  .tog-btn.active { background: var(--color-text-primary); color: var(--color-background-primary); border-color: var(--color-text-primary); }
  .wing-slot { border-bottom: 0.5px solid var(--color-border-tertiary); }
  .wing-slot-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; cursor: pointer; user-select: none; }
  .wing-slot-title { font-size: 12px; font-weight: 500; color: var(--color-text-primary); }
  .wing-slot-actions { display: flex; gap: 6px; align-items: center; }
  .slot-action-btn { font-size: 11px; padding: 3px 8px; border: 0.5px solid var(--color-border-secondary); border-radius: 4px; background: transparent; cursor: pointer; color: var(--color-text-secondary); }
  .slot-action-btn:hover { color: var(--color-text-primary); border-color: var(--color-border-primary); }
  .slot-action-btn.remove:hover { color: #e53e3e; border-color: #e53e3e; }
  .wing-slot-body { padding: 0 16px 12px; display: none; }
  .wing-slot-body.open { display: block; }
  .add-wing-btn { margin: 10px 16px; padding: 8px; font-size: 12px; border: 0.5px dashed var(--color-border-secondary); border-radius: 6px; background: transparent; cursor: pointer; color: var(--color-text-tertiary); width: calc(100% - 32px); transition: all 0.15s; }
  .add-wing-btn:hover:not(:disabled) { color: var(--color-text-primary); border-color: var(--color-border-primary); }
  .add-wing-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .slot-parts-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 8px; }
</style>

<div class="builder">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="brand-name">Character Builder</div>
      <div class="section-title">LightKeeper</div>
    </div>
    <div class="tab-row">
      <button class="tab active" onclick="switchTab('parts')">파츠</button>
      <button class="tab" onclick="switchTab('adjust')">위치 조정</button>
    </div>

    <div id="tab-parts" class="ctrl-section active">
      <div class="category">
        <div class="cat-label">Frame</div>
        <div class="parts-grid" id="frame-grid"></div>
      </div>
      <div class="category">
        <div class="cat-label">Eye</div>
        <div class="parts-grid" id="eye-grid"></div>
      </div>
      <div class="category" style="padding-bottom:0;">
        <div class="cat-label" style="padding:0 0 8px;">Wing</div>
        <div id="wing-slots"></div>
        <button class="add-wing-btn" id="add-wing-btn" onclick="addWingSlot()">+ 날개 추가</button>
      </div>
      <div class="category">
        <div class="cat-label">Tail</div>
        <div class="parts-grid" id="tail-grid"></div>
        <div id="tail-sym-row" style="margin-top:8px; display:none;">
          <div class="ctrl-row">
            <span class="ctrl-label" style="width:36px;">배치</span>
            <div class="btn-group" style="flex:1;">
              <button class="tog-btn active" id="tail-sym-off" onclick="setTailSym(false)">한쪽</button>
              <button class="tog-btn" id="tail-sym-on" onclick="setTailSym(true)">대칭</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="tab-adjust" class="ctrl-section">
      <div class="ctrl-group">
        <div class="cat-label" style="margin-bottom:10px;">Frame</div>
        <div class="ctrl-row"><span class="ctrl-label">크기</span><input type="range" min="60" max="140" value="100" step="1" oninput="updateCtrl('frame','scale',this.value)"/><span class="ctrl-val" id="frame-scale-val">100%</span></div>
      </div>
      <div class="ctrl-group">
        <div class="cat-label" style="margin-bottom:10px;">Eye</div>
        <div class="ctrl-row"><span class="ctrl-label">X</span><input type="range" min="-50" max="50" value="0" step="1" oninput="updateCtrl('eye','x',this.value)"/><span class="ctrl-val" id="eye-x-val">0</span></div>
        <div class="ctrl-row"><span class="ctrl-label">Y</span><input type="range" min="-50" max="50" value="0" step="1" oninput="updateCtrl('eye','y',this.value)"/><span class="ctrl-val" id="eye-y-val">0</span></div>
        <div class="ctrl-row"><span class="ctrl-label">크기</span><input type="range" min="30" max="160" value="100" step="1" oninput="updateCtrl('eye','scale',this.value)"/><span class="ctrl-val" id="eye-scale-val">100%</span></div>
        <div class="ctrl-row"><span class="ctrl-label">회전</span><input type="range" min="-180" max="180" value="0" step="1" oninput="updateCtrl('eye','rot',this.value)"/><span class="ctrl-val" id="eye-rot-val">0°</span></div>
      </div>
      <div id="adjust-wings-area"></div>
      <div class="ctrl-group" id="adjust-tail-area" style="display:none;">
        <div class="cat-label" style="margin-bottom:10px;">Tail</div>
        <div class="ctrl-row"><span class="ctrl-label">X</span><input type="range" min="-80" max="80" value="0" step="1" oninput="updateTailCtrl('x',this.value)"/><span class="ctrl-val" id="tail-x-val">0</span></div>
        <div class="ctrl-row"><span class="ctrl-label">Y</span><input type="range" min="-20" max="120" value="55" step="1" oninput="updateTailCtrl('y',this.value)"/><span class="ctrl-val" id="tail-y-val">55</span></div>
        <div class="ctrl-row"><span class="ctrl-label">크기</span><input type="range" min="30" max="300" value="100" step="1" oninput="updateTailCtrl('scale',this.value)"/><span class="ctrl-val" id="tail-scale-val">100%</span></div>
        <div class="ctrl-row"><span class="ctrl-label">회전</span><input type="range" min="-180" max="180" value="0" step="1" oninput="updateTailCtrl('rot',this.value)"/><span class="ctrl-val" id="tail-rot-val">0°</span></div>
      </div>
      <p class="tip">각 파츠의 위치와 크기를 조절해서 나만의 조합을 만들어보세요.</p>
    </div>
  </div>

  <div class="canvas-area">
    <div class="canvas-header">
      <span class="canvas-title">미리보기</span>
      <div class="action-btns">
        <button class="action-btn" onclick="randomize()">랜덤</button>
        <button class="action-btn" onclick="exportSVG()">내보내기</button>
      </div>
    </div>
    <div class="canvas-wrap">
      <svg id="stage" width="320" height="320" viewBox="-160 -160 320 320" style="overflow:visible;">
        <g id="g-wings"></g>
        <g id="g-tail"></g>
        <g id="g-frame"></g>
        <g id="g-eye"></g>
      </svg>
    </div>
  </div>
</div>

function normalizeColor(html) {
  return html
    .replace(/fill="#[0-9a-fA-F]{3,6}"/g, 'fill="currentColor"')
    .replace(/stroke="#[0-9a-fA-F]{3,6}"/g, 'stroke="currentColor"')
    .replace(/fill="black"/g,'fill="currentColor"')
    .replace(/stroke="black"/g,'stroke="currentColor"');
}
function vbTransform(vb, size) {
  const [x,y,w,h] = vb;
  const sc = size / Math.max(w,h);
  return `translate(${-(x+w/2)*sc},${-(y+h/2)*sc}) scale(${sc})`;
}

  { id:'none', label:'없음', vb:null, content:null },
  { id:'tail_01', label:'T01', vb:[0,0,17.34,17.77],  content:`<polygon points="0 0 17.34 0 8.67 17.77 0 0" fill="#231f20"/>` },
  { id:'tail_02', label:'T02', vb:[0,0,17.34,26.51],  content:`<path d="M0,0h17.34l-6.75,25.04c-.53,1.96-3.31,1.96-3.84,0L0,0Z" fill="#231f20"/>` },
  { id:'tail_03', label:'T03', vb:[0,0,16.56,44.01],  content:`<path d="M.17,0c-.11,2.37-.17,4.81-.17,7.32,0,20.27,3.71,36.69,8.28,36.69S16.56,27.59,16.56,7.32c0-2.51-.06-4.95-.17-7.32H.17Z" fill="#231f20"/>` },
  { id:'tail_04', label:'T04', vb:[0,0,17.75,17.75],  content:`<circle cx="8.87" cy="8.87" r="8.87" fill="#231f20"/>` },
  { id:'tail_05', label:'T05', vb:[0,0,17.58,17.58],  content:`<rect width="17.58" height="17.58" fill="#231f20"/>` },

  { id:'tail_07', label:'T07', vb:[0,0,28.09,28.09],  content:`<path d="M14.04,0c-.33,7.62-6.43,13.72-14.04,14.04,7.62.33,13.72,6.43,14.04,14.04.33-7.62,6.43-13.72,14.04-14.04-7.62-.33-13.72-6.43-14.04-14.04Z" fill="#231f20"/>` },
];

// ── state ──
const DEFAULT_WING_SCALE = 150;
const DEFAULT_WING_TX    = 95; // 날개 기본 X 오프셋 (오른쪽으로 더 띄움)

let wingSlots = [
  { id:0, wingId:'wing_07', x:0, y:0, scale:DEFAULT_WING_SCALE, rot:0, flip:0, symmetric:false, open:true }
];
let nextSlotId = 1;

const state = {
  frame: { id:'frame_02', scale:100 },
  eye:   { id:'eye_02', x:0, y:0, scale:100, rot:0 },
  tail:  { id:'none', x:0, y:55, scale:100, rot:0, symmetric:false },
};

// ── 탭 ──
function switchTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.textContent.includes(t==='parts'?'파츠':'위치')));
  document.querySelectorAll('.ctrl-section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-'+t).classList.add('active');
  if (t==='adjust') renderAdjustWings();
}

// ── 파츠 그리드 ──
function buildGrid(gridId, parts, category) {
  const grid = document.getElementById(gridId); if (!grid) return;
  grid.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';
  parts.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'part-btn' + (state[category] && state[category].id===p.id ? ' selected':'');
    if (!p.content) {
      btn.innerHTML = '<span style="font-size:10px;color:var(--color-text-tertiary)">없음</span>';
    } else {
      const s = document.createElementNS(ns,'svg');
      s.setAttribute('viewBox',`${p.vb[0]} ${p.vb[1]} ${p.vb[2]} ${p.vb[3]}`);
      s.innerHTML = normalizeColor(p.content);
      btn.appendChild(s);
    }
    btn.onclick = () => {
      state[category].id = p.id;
      buildGrid(gridId, parts, category);
      if (category==='tail') {
        document.getElementById('tail-sym-row').style.display = p.id==='none' ? 'none' : 'block';
        const adjTail = document.getElementById('adjust-tail-area');
        if (adjTail) adjTail.style.display = p.id==='none' ? 'none' : 'block';
      }
      render();
    };
    btn.title = p.label;
    grid.appendChild(btn);
  });
}

// ── 꼬리 대칭 ──
function setTailSym(val) {
  state.tail.symmetric = val;
  document.getElementById('tail-sym-off').classList.toggle('active', !val);
  document.getElementById('tail-sym-on').classList.toggle('active', val);
  render();
}

// ── 날개 슬롯 ──
function buildWingSlots() {
  const container = document.getElementById('wing-slots');
  container.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';
  wingSlots.forEach((slot, idx) => {
    const wrap = document.createElement('div'); wrap.className='wing-slot';
    const header = document.createElement('div'); header.className='wing-slot-header';
    const title = document.createElement('span'); title.className='wing-slot-title'; title.textContent=`Wing ${idx+1}`;
    const actions = document.createElement('div'); actions.className='wing-slot-actions';
    if (wingSlots.length > 1) {
      const rem = document.createElement('button'); rem.className='slot-action-btn remove'; rem.textContent='제거';
      rem.onclick = e => { e.stopPropagation(); removeWingSlot(slot.id); }; actions.appendChild(rem);
    }
    const tog = document.createElement('button'); tog.className='slot-action-btn';
    tog.textContent = slot.open?'접기':'펼치기';
    tog.onclick = e => { e.stopPropagation(); slot.open=!slot.open; buildWingSlots(); };
    actions.appendChild(tog); header.appendChild(title); header.appendChild(actions);
    header.onclick = () => { slot.open=!slot.open; buildWingSlots(); };
    wrap.appendChild(header);

    const body = document.createElement('div');
    body.className = 'wing-slot-body'+(slot.open?' open':'');

    // 파츠 그리드
    const grid = document.createElement('div'); grid.className='slot-parts-grid';
    WINGS.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'part-btn'+(slot.wingId===p.id?' selected':'');
      if (!p.content) { btn.innerHTML='<span style="font-size:10px;color:var(--color-text-tertiary)">없음</span>'; }
      else {
        const s = document.createElementNS(ns,'svg');
        s.setAttribute('viewBox',`${p.vb[0]} ${p.vb[1]} ${p.vb[2]} ${p.vb[3]}`);
        s.innerHTML = normalizeColor(p.content); btn.appendChild(s);
      }
      btn.onclick = () => { slot.wingId=p.id; buildWingSlots(); render(); };
      grid.appendChild(btn);
    });
    body.appendChild(grid);

    // 뒤집기
    const flipRow = document.createElement('div'); flipRow.className='ctrl-row';
    flipRow.innerHTML=`<span class="ctrl-label" style="width:36px;font-size:12px;color:var(--color-text-secondary);">뒤집기</span>`;
    const flipGroup = document.createElement('div'); flipGroup.className='btn-group';
    ['오른쪽','왼쪽'].forEach((label,val) => {
      const b=document.createElement('button'); b.className='tog-btn'+(slot.flip===val?' active':'');
      b.textContent=label; b.onclick=()=>{slot.flip=val;buildWingSlots();render();}; flipGroup.appendChild(b);
    });
    flipRow.appendChild(flipGroup); body.appendChild(flipRow);

    // 대칭
    const symRow = document.createElement('div'); symRow.className='ctrl-row'; symRow.style.marginTop='6px';
    symRow.innerHTML=`<span class="ctrl-label" style="width:36px;font-size:12px;color:var(--color-text-secondary);">배치</span>`;
    const symGroup = document.createElement('div'); symGroup.className='btn-group';
    [['한쪽',false],['대칭',true]].forEach(([label,val]) => {
      const b=document.createElement('button'); b.className='tog-btn'+(slot.symmetric===val?' active':'');
      b.textContent=label; b.onclick=()=>{slot.symmetric=val;buildWingSlots();render();}; symGroup.appendChild(b);
    });
    symRow.appendChild(symGroup); body.appendChild(symRow);
    wrap.appendChild(body); container.appendChild(wrap);
  });
  const addBtn = document.getElementById('add-wing-btn');
  addBtn.disabled = wingSlots.length>=3;
  addBtn.textContent = wingSlots.length>=3 ? '날개 최대 3쌍':'+ 날개 추가';
}

function addWingSlot() {
  if (wingSlots.length>=3) return;
  wingSlots.push({ id:nextSlotId++, wingId:WINGS[1+Math.floor(Math.random()*(WINGS.length-1))].id, x:0, y:-15*wingSlots.length, scale:DEFAULT_WING_SCALE, rot:0, flip:0, symmetric:false, open:true });
  buildWingSlots(); renderAdjustWings(); render();
}
function removeWingSlot(id) {
  wingSlots=wingSlots.filter(s=>s.id!==id); buildWingSlots(); renderAdjustWings(); render();
}

// ── 위치조정 탭 - 날개 ──
function renderAdjustWings() {
  const area=document.getElementById('adjust-wings-area'); if(!area) return;
  area.innerHTML='';
  wingSlots.forEach((slot,idx) => {
    const g=document.createElement('div'); g.className='ctrl-group';
    g.innerHTML=`
      <div class="cat-label" style="margin-bottom:10px;">Wing ${idx+1}</div>
      <div class="ctrl-row"><span class="ctrl-label">X</span><input type="range" min="-130" max="130" value="${slot.x}" step="1" oninput="updateWingCtrl(${slot.id},'x',this.value)"/><span class="ctrl-val" id="wctrl-${slot.id}-x">${slot.x}</span></div>
      <div class="ctrl-row"><span class="ctrl-label">Y</span><input type="range" min="-130" max="130" value="${slot.y}" step="1" oninput="updateWingCtrl(${slot.id},'y',this.value)"/><span class="ctrl-val" id="wctrl-${slot.id}-y">${slot.y}</span></div>
      <div class="ctrl-row"><span class="ctrl-label">크기</span><input type="range" min="40" max="250" value="${slot.scale}" step="1" oninput="updateWingCtrl(${slot.id},'scale',this.value)"/><span class="ctrl-val" id="wctrl-${slot.id}-scale">${slot.scale}%</span></div>
      <div class="ctrl-row"><span class="ctrl-label">회전</span><input type="range" min="-180" max="180" value="${slot.rot}" step="1" oninput="updateWingCtrl(${slot.id},'rot',this.value)"/><span class="ctrl-val" id="wctrl-${slot.id}-rot">${slot.rot}°</span></div>`;
    area.appendChild(g);
  });
}
function updateWingCtrl(slotId,prop,val) {
  val=parseFloat(val);
  const slot=wingSlots.find(s=>s.id===slotId); if(!slot) return;
  slot[prop]=val;
  const display=prop==='scale'?val+'%':prop==='rot'?val+'°':val+'';
  const el=document.getElementById(`wctrl-${slotId}-${prop}`); if(el) el.textContent=display;
  render();
}

// ── 꼬리 조정 ──
function updateTailCtrl(prop, val) {
  val = parseFloat(val);
  state.tail[prop] = val;
  const display = prop==='scale' ? val+'%' : prop==='rot' ? val+'°' : val+'';
  const el = document.getElementById(`tail-${prop}-val`); if(el) el.textContent=display;
  render();
}

// ── Frame/Eye 조정 ──
function updateCtrl(cat,prop,val) {
  val=parseFloat(val); state[cat][prop]=val;
  const display=prop==='scale'?Math.round(val)+'%':prop==='rot'?Math.round(val)+'°':Math.round(val)+'';
  const el=document.getElementById(`${cat}-${prop}-val`); if(el) el.textContent=display;
  render();
}

// ── 렌더 ──
function renderPart(parentG, def, transform, size) {
  if (!def||!def.content) return;
  const ns='http://www.w3.org/2000/svg';
  const outer=document.createElementNS(ns,'g'); outer.setAttribute('transform',transform);
  const inner=document.createElementNS(ns,'g'); inner.setAttribute('transform',vbTransform(def.vb,size));
  inner.innerHTML=normalizeColor(def.content); outer.appendChild(inner); parentG.appendChild(outer);
}

function render() {
  const ns='http://www.w3.org/2000/svg';

  // Wings — 맨 뒤
  const wingsG=document.getElementById('g-wings'); wingsG.innerHTML='';
  wingSlots.forEach(slot => {
    const def=WINGS.find(p=>p.id===slot.wingId); if(!def||!def.content) return;
    const sc=slot.scale/100, flip=slot.flip?-1:1;
    const tx=DEFAULT_WING_TX+slot.x, ty=slot.y;
    renderPart(wingsG, def, `translate(${tx},${ty}) rotate(${slot.rot}) scale(${flip*sc},${sc})`, 100);
    if (slot.symmetric) renderPart(wingsG, def, `translate(${-tx},${ty}) rotate(${-slot.rot}) scale(${-flip*sc},${sc})`, 100);
  });

  // Tail — frame 뒤, 아래 중앙에 겹치게
  const tg=document.getElementById('g-tail'); tg.innerHTML='';
  const td=TAILS.find(p=>p.id===state.tail.id);
  if (td && td.content) {
    const t=state.tail, sc=t.scale/100;
    renderPart(tg, td, `translate(${t.x},${t.y}) rotate(${t.rot}) scale(${sc})`, 40);
    if (t.symmetric) {
      renderPart(tg, td, `translate(${-t.x},${t.y}) rotate(${-t.rot}) scale(${-sc},${sc})`, 40);
    }
  }

  // Frame
  const fg=document.getElementById('g-frame'); fg.innerHTML='';
  const fd=FRAMES.find(p=>p.id===state.frame.id);
  if (fd&&fd.content) renderPart(fg, fd, `scale(${state.frame.scale/100})`, 120);

  // Eye
  const eg=document.getElementById('g-eye'); eg.innerHTML='';
  const ed=EYES.find(p=>p.id===state.eye.id);
  if (ed&&ed.content) {
    const e=state.eye;
    renderPart(eg, ed, `translate(${e.x},${e.y}) rotate(${e.rot}) scale(${e.scale/100})`, 50);
  }
}

function randomize() {
  state.frame.id=FRAMES[1+Math.floor(Math.random()*(FRAMES.length-1))].id;
  state.eye.id=EYES[1+Math.floor(Math.random()*(EYES.length-1))].id;
  state.tail.id='none';
  wingSlots=[{ id:0, wingId:WINGS[1+Math.floor(Math.random()*(WINGS.length-1))].id,
    x:Math.floor(Math.random()*15), y:-(Math.floor(Math.random()*20)+10),
    scale:DEFAULT_WING_SCALE, rot:0, flip:0, symmetric:false, open:true }];
  nextSlotId=1;
  buildGrid('frame-grid',FRAMES,'frame');
  buildGrid('eye-grid',EYES,'eye');
  buildGrid('tail-grid',TAILS,'tail');
  buildWingSlots(); renderAdjustWings();
  document.getElementById('tail-sym-row').style.display='none';
  const adjTail=document.getElementById('adjust-tail-area'); if(adjTail) adjTail.style.display='none';
  render();
}

function exportSVG() {
  const inner=document.getElementById('stage').innerHTML;
  const blob=new Blob([`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -160 320 320">${inner}</svg>`],{type:'image/svg+xml'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='lightkeeper.svg'; a.click();
}

// 초기화
buildGrid('frame-grid',FRAMES,'frame');
buildGrid('eye-grid',EYES,'eye');
buildGrid('tail-grid',TAILS,'tail');
buildWingSlots();
render();
</script>
