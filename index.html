<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LightKeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f3ef;--bg2:#eceae4;--bg3:#e2dfd8;
  --border:#d5d1c8;--border2:#bfbab0;
  --text:#1c1a17;--text2:#6b6760;--text3:#a09b93;
  --accent:#1c1a17;--white:#ffffff;--red:#b03020;
  --sidebar:292px;--nav:52px;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

/* NAV */
.nav{height:var(--nav);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);background:var(--bg);z-index:20;}
.nav-brand{font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;display:flex;align-items:baseline;gap:8px;}
.nav-brand-sub{font-family:'DM Mono',monospace;font-size:10px;font-weight:400;color:var(--text3);letter-spacing:0.06em;text-transform:none;}
.nav-center{display:flex;gap:2px;}
.nav-tab{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.06em;padding:6px 16px;border-radius:20px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--text2);transition:all 0.15s;}
.nav-tab:hover{color:var(--text);background:var(--bg2);}
.nav-tab.active{color:var(--text);background:var(--bg2);border-color:var(--border2);}
.nav-right{display:flex;gap:8px;}
.btn{font-family:'Syne',sans-serif;font-size:12px;font-weight:600;padding:7px 16px;border-radius:6px;border:1px solid var(--border2);background:var(--bg2);color:var(--text);cursor:pointer;transition:all 0.15s;}
.btn:hover{background:var(--bg3);}
.btn-primary{background:var(--accent);color:var(--white);border-color:var(--accent);}
.btn-primary:hover{opacity:0.82;}

/* PAGES */
.page{display:none;flex:1;overflow:hidden;}
.page.active{display:flex;}

/* BUILDER */
.builder{display:flex;width:100%;height:100%;}
.sidebar{width:var(--sidebar);flex-shrink:0;border-right:1px solid var(--border);background:var(--bg2);overflow-y:auto;display:flex;flex-direction:column;}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.tab-row{display:flex;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:5;}
.stab{flex:1;padding:10px 6px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);border:none;background:transparent;cursor:pointer;border-bottom:1.5px solid transparent;margin-bottom:-1px;transition:color 0.15s;}
.stab:hover{color:var(--text);}
.stab.active{color:var(--text);border-bottom-color:var(--accent);}
.ctrl-section{display:none;}
.ctrl-section.active{display:block;}
.category{padding:12px 14px;border-bottom:1px solid var(--border);}
.cat-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.14em;color:var(--text3);text-transform:uppercase;margin-bottom:9px;}
.cat-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.cat-header .cat-label{margin-bottom:0;}
.parts-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
.slot-parts-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:9px;}
.part-btn{aspect-ratio:1;border-radius:6px;border:1px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:5px;overflow:hidden;transition:all 0.12s;}
.part-btn:hover{border-color:var(--border2);}
.part-btn.selected{border:2px solid var(--accent);}
.part-btn svg{width:100%;height:100%;}

/* 색상 피커 */
.color-swatch{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border2);cursor:pointer;flex-shrink:0;position:relative;overflow:hidden;transition:border-color 0.15s;}
.color-swatch:hover{border-color:var(--text);}
.color-swatch input[type=color]{position:absolute;inset:-4px;opacity:0;cursor:pointer;width:calc(100%+8px);height:calc(100%+8px);}

.ctrl-group{padding:11px 14px;border-bottom:1px solid var(--border);}
.ctrl-group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.ctrl-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.ctrl-row:last-child{margin-bottom:0;}
.ctrl-lbl{font-family:'DM Mono',monospace;font-size:9px;color:var(--text2);width:26px;flex-shrink:0;}
.ctrl-row input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer;}
.ctrl-val{font-family:'DM Mono',monospace;font-size:9px;color:var(--text);min-width:34px;text-align:right;}
.btn-group{display:flex;gap:4px;flex:1;}
.tog-btn{flex:1;padding:4px 5px;font-family:'DM Mono',monospace;font-size:9px;border:1px solid var(--border2);border-radius:4px;background:var(--bg);cursor:pointer;color:var(--text2);transition:all 0.12s;}
.tog-btn:hover{color:var(--text);}
.tog-btn.active{background:var(--accent);color:var(--white);border-color:var(--accent);}
.wing-slot{border-bottom:1px solid var(--border);}
.wing-slot-hdr{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;cursor:pointer;user-select:none;}
.wing-slot-hdr:hover{background:rgba(0,0,0,0.02);}
.wing-slot-ttl{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;color:var(--text);letter-spacing:0.1em;text-transform:uppercase;}
.wing-slot-acts{display:flex;gap:4px;align-items:center;}
.slot-btn{font-family:'DM Mono',monospace;font-size:9px;padding:2px 7px;border:1px solid var(--border);border-radius:3px;background:transparent;cursor:pointer;color:var(--text2);transition:all 0.12s;}
.slot-btn:hover{color:var(--text);border-color:var(--border2);}
.slot-btn.rm:hover{color:var(--red);border-color:var(--red);}
.wing-slot-body{padding:0 14px 10px;display:none;}
.wing-slot-body.open{display:block;}
.add-wing-btn{display:block;margin:8px 14px;padding:8px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;border:1px dashed var(--border2);border-radius:5px;background:transparent;cursor:pointer;color:var(--text3);width:calc(100% - 28px);transition:all 0.15s;}
.add-wing-btn:hover:not(:disabled){color:var(--text);border-color:var(--accent);}
.add-wing-btn:disabled{opacity:0.3;cursor:not-allowed;}

/* 캔버스 */
.canvas-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.canvas-area::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,var(--border) 1px,transparent 1px);background-size:24px 24px;opacity:0.6;pointer-events:none;}
.canvas-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:0.04em;pointer-events:none;white-space:nowrap;}
.selected-indicator{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:10px;color:var(--text2);background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;pointer-events:none;opacity:0;transition:opacity 0.2s;}
.selected-indicator.show{opacity:1;}
#stage{overflow:visible;position:relative;z-index:1;cursor:default;}
#stage.drag-active{cursor:grabbing;}

/* LOUNGE */
.lounge-page{display:flex;flex-direction:column;width:100%;height:100%;}
.lounge-hdr{flex-shrink:0;padding:20px 28px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;}
.lounge-title{font-size:20px;font-weight:700;letter-spacing:0.04em;margin-bottom:3px;}
.lounge-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);letter-spacing:0.05em;}
.lounge-body{flex:1;overflow-y:auto;padding:24px 28px;}
.lounge-body::-webkit-scrollbar{width:4px;}
.lounge-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.lounge-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.lounge-empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--text3);font-family:'DM Mono',monospace;font-size:11px;line-height:2.2;}
.lounge-card{border:1px solid var(--border);border-radius:10px;background:var(--bg2);overflow:hidden;cursor:pointer;transition:border-color 0.18s,box-shadow 0.18s;display:flex;flex-direction:column;}
.lounge-card:hover{border-color:var(--border2);box-shadow:0 6px 20px rgba(0,0,0,0.07);}
.lounge-card-cv{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--bg);border-bottom:1px solid var(--border);overflow:hidden;}
.lounge-card-cv svg{overflow:visible;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.float-wrap{animation:float var(--dur,3.2s) ease-in-out infinite;animation-delay:var(--delay,0s);}
.lounge-card-info{padding:10px 12px 4px;}
.lounge-card-name{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lounge-card-date{font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);}
.lounge-card-foot{display:flex;justify-content:flex-end;padding:6px 12px 10px;}
.del-btn{font-family:'DM Mono',monospace;font-size:9px;padding:2px 8px;border:1px solid transparent;border-radius:3px;background:transparent;cursor:pointer;color:var(--text3);transition:all 0.12s;}
.del-btn:hover{color:var(--red);border-color:var(--red);}

/* MODALS */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(28,26,23,0.4);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:18px;width:320px;box-shadow:0 24px 64px rgba(0,0,0,0.15);}
.modal-title{font-size:15px;font-weight:700;}
.modal-desc{font-family:'DM Mono',monospace;font-size:10px;color:var(--text2);line-height:1.7;}
.modal input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:6px;background:var(--bg2);color:var(--text);font-family:'Syne',sans-serif;font-size:14px;font-weight:500;outline:none;transition:border-color 0.15s;}
.modal input[type=text]:focus{border-color:var(--accent);}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}
.view-modal{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:36px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0 24px 64px rgba(0,0,0,0.15);}
.view-modal-name{font-size:16px;font-weight:700;}
.view-modal-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);}
</style>
</head>
<body>

<div class="nav">
  <div class="nav-brand">LightKeeper<span class="nav-brand-sub">Character Builder</span></div>
  <div class="nav-center">
    <button class="nav-tab active" onclick="goPage('builder')">Builder</button>
    <button class="nav-tab" onclick="goPage('lounge')">Lounge <span id="lounge-count" style="font-size:10px;opacity:0.5;font-family:'DM Mono',monospace;"></span></button>
  </div>
  <div class="nav-right">
    <button class="btn" onclick="randomize()">랜덤</button>
    <button class="btn btn-primary" onclick="openSaveModal()">라운지에 저장 →</button>
  </div>
</div>

<!-- BUILDER -->
<div class="page active" id="page-builder">
<div class="builder">
  <div class="sidebar">
    <div class="tab-row">
      <button class="stab active" onclick="switchTab('parts')">파츠 선택</button>
      <button class="stab" onclick="switchTab('adjust')">크기 · 회전</button>
    </div>

    <!-- 파츠 탭 -->
    <div id="tab-parts" class="ctrl-section active">
      <div class="category">
        <div class="cat-header">
          <div class="cat-label">Frame</div>
          <div class="color-swatch" id="swatch-frame" title="Frame 색상">
            <input type="color" value="#1c1a17" oninput="setColor('frame',this.value)"/>
          </div>
        </div>
        <div class="parts-grid" id="frame-grid"></div>
      </div>
      <div class="category">
        <div class="cat-header">
          <div class="cat-label">Eye</div>
          <div class="color-swatch" id="swatch-eye" title="Eye 색상">
            <input type="color" value="#1c1a17" oninput="setColor('eye',this.value)"/>
          </div>
        </div>
        <div class="parts-grid" id="eye-grid"></div>
      </div>
      <div class="category" style="padding-bottom:0;">
        <div class="cat-header">
          <div class="cat-label" style="padding:0 0 0;">Wing</div>
          <div class="color-swatch" id="swatch-wing" title="Wing 색상">
            <input type="color" value="#1c1a17" oninput="setColor('wing',this.value)"/>
          </div>
        </div>
        <div style="height:8px;"></div>
        <div id="wing-slots"></div>
        <button class="add-wing-btn" id="add-wing-btn" onclick="addWingSlot()">+ 날개 추가</button>
      </div>
      <div class="category">
        <div class="cat-header">
          <div class="cat-label">Tail</div>
          <div class="color-swatch" id="swatch-tail" title="Tail 색상">
            <input type="color" value="#1c1a17" oninput="setColor('tail',this.value)"/>
          </div>
        </div>
        <div class="parts-grid" id="tail-grid"></div>
        <div id="tail-sym-row" style="margin-top:9px;display:none;">
          <div class="ctrl-row"><span class="ctrl-lbl">배치</span><div class="btn-group"><button class="tog-btn active" id="tail-sym-off" onclick="setTailSym(false)">한쪽</button><button class="tog-btn" id="tail-sym-on" onclick="setTailSym(true)">대칭</button></div></div>
        </div>
      </div>
    </div>

    <!-- 조정 탭 (크기·회전만) -->
    <div id="tab-adjust" class="ctrl-section">
      <div class="ctrl-group">
        <div class="cat-label" style="margin-bottom:8px;">Frame</div>
        <div class="ctrl-row"><span class="ctrl-lbl">크기</span><input type="range" min="60" max="140" value="100" step="1" oninput="uc('frame','scale',this.value)"/><span class="ctrl-val" id="frame-scale-val">100%</span></div>
      </div>
      <div class="ctrl-group">
        <div class="cat-label" style="margin-bottom:8px;">Eye</div>
        <div class="ctrl-row"><span class="ctrl-lbl">크기</span><input type="range" min="30" max="160" value="100" step="1" oninput="uc('eye','scale',this.value)"/><span class="ctrl-val" id="eye-scale-val">100%</span></div>
        <div class="ctrl-row"><span class="ctrl-lbl">회전</span><input type="range" min="-180" max="180" value="0" step="1" oninput="uc('eye','rot',this.value)"/><span class="ctrl-val" id="eye-rot-val">0°</span></div>
      </div>
      <div id="adjust-wings-area"></div>
      <div class="ctrl-group" id="adjust-tail-area" style="display:none;">
        <div class="cat-label" style="margin-bottom:8px;">Tail</div>
        <div class="ctrl-row"><span class="ctrl-lbl">크기</span><input type="range" min="30" max="300" value="100" step="1" oninput="utc('scale',this.value)"/><span class="ctrl-val" id="tail-scale-val">100%</span></div>
        <div class="ctrl-row"><span class="ctrl-lbl">회전</span><input type="range" min="-180" max="180" value="0" step="1" oninput="utc('rot',this.value)"/><span class="ctrl-val" id="tail-rot-val">0°</span></div>
      </div>
      <p style="font-family:'DM Mono',monospace;font-size:9px;color:var(--text3);padding:12px 14px;line-height:1.7;">캔버스에서 파츠를 직접 클릭·드래그해서<br>위치를 조정할 수 있어요.</p>
    </div>
  </div>

  <!-- 캔버스 -->
  <div class="canvas-area" id="canvas-area">
    <div class="selected-indicator" id="selected-indicator"></div>
    <svg id="stage" width="380" height="380" viewBox="-190 -190 380 380">
      <g id="g-wings"></g>
      <g id="g-tail"></g>
      <g id="g-frame"></g>
      <g id="g-eye"></g>
      <!-- 드래그 히트존 (투명) -->
      <g id="g-hit"></g>
    </svg>
    <div class="canvas-hint">파츠를 클릭해서 드래그로 위치 이동</div>
  </div>
</div>
</div>

<!-- LOUNGE -->
<div class="page" id="page-lounge">
  <div class="lounge-page">
    <div class="lounge-hdr">
      <div>
        <div class="lounge-title">Lightkeeper Lounge</div>
        <div class="lounge-sub" id="lounge-sub">라운지에 저장된 Lightkeeper들을 만나보세요</div>
      </div>
    </div>
    <div class="lounge-body">
      <div class="lounge-grid" id="lounge-grid"></div>
    </div>
  </div>
</div>

<!-- SAVE MODAL -->
<div class="modal-bg" id="save-modal">
  <div class="modal">
    <div><div class="modal-title">라운지에 저장하기</div><div class="modal-desc" style="margin-top:6px;">만든 사람의 이름을 입력하면<br>라운지에 저장됩니다.</div></div>
    <input type="text" id="creator-name" placeholder="이름을 입력하세요" maxlength="20" onkeydown="if(event.key==='Enter')saveToLounge()"/>
    <div class="modal-actions"><button class="btn" onclick="closeModal('save-modal')">취소</button><button class="btn btn-primary" onclick="saveToLounge()">저장하기</button></div>
  </div>
</div>

<!-- VIEW MODAL -->
<div class="modal-bg" id="view-modal">
  <div class="view-modal">
    <svg id="view-stage" width="240" height="240" viewBox="-180 -180 360 360" style="overflow:visible;"></svg>
    <div style="text-align:center;"><div class="view-modal-name" id="view-name"></div><div class="view-modal-date" id="view-date"></div></div>
    <div class="modal-actions"><button class="btn" onclick="closeModal('view-modal')">닫기</button><button class="btn btn-primary" onclick="exportFromView()">SVG 저장</button></div>
  </div>
</div>

<script>
// ── 색상 정규화: 하드코딩 색상 → CSS 변수 컬러로 교체 ──
function applyColor(html, color){
  const lightGray=/^(fff|ffffff|e6e7e8|f1f2f2|eeeeee|f0f0f0|f2f2f2|e8e8e8)$/i;

  // hex 색상을 opacity 비율로 white와 블렌딩 → 새 hex 반환
  function blendWithWhite(hex, opacity){
    let h=hex.replace('#','');
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
    const nr=Math.round(r*opacity+255*(1-opacity));
    const ng=Math.round(g*opacity+255*(1-opacity));
    const nb=Math.round(b*opacity+255*(1-opacity));
    return '#'+[nr,ng,nb].map(v=>v.toString(16).padStart(2,'0')).join('');
  }

  // fill="currentColor" fill-opacity="X" → blended hex color, remove fill-opacity
  let result = html.replace(
    /fill="currentColor"\s+fill-opacity="([0-9.]+)"/g,
    (m, op) => `fill="${blendWithWhite(color, parseFloat(op))}"`
  );
  // stroke="currentColor" stroke-opacity="X" → blended hex color
  result = result.replace(
    /stroke="currentColor"\s+stroke-opacity="([0-9.]+)"/g,
    (m, op) => `stroke="${blendWithWhite(color, parseFloat(op))}"`
  );

  // 나머지 일반 처리
  result = result
    .replace(/fill="#([0-9a-fA-F]{3,6})"/g,(m,c)=>lightGray.test(c)?`fill="white"`:c==='none'?m:`fill="${color}"`)
    .replace(/stroke="#([0-9a-fA-F]{3,6})"/g,(m,c)=>lightGray.test(c)?`stroke="white"`:c==='none'?m:`stroke="${color}"`)
    .replace(/fill="black"/g,`fill="${color}"`)
    .replace(/stroke="black"/g,`stroke="${color}"`)
    .replace(/fill="currentColor"/g,`fill="${color}"`)
    .replace(/stroke="currentColor"/g,`stroke="${color}"`);
  return result;
}
function nc(html){ return applyColor(html,'currentColor'); }
function vbt(vb,sz){const[x,y,w,h]=vb,sc=sz/Math.max(w,h);return `translate(${-(x+w/2)*sc},${-(y+h/2)*sc}) scale(${sc})`;}

// ── 파츠 데이터 ──
const FRAMES=[

const DWS=150, DTX=95;
let wingSlots=[{id:0,wingId:'wing_07',x:0,y:0,scale:DWS,rot:0,flip:0,symmetric:false,open:true}];
let nextSlotId=1;
const ST={
  frame:{id:'frame_02',scale:100},
  eye:{id:'eye_02',x:0,y:0,scale:100,rot:0},
  tail:{id:'none',x:0,y:55,scale:100,rot:0,symmetric:false},

// ── 색상 ──
function setColor(cat,val){

// ── SVG 렌더 헬퍼 ──
function rpColored(pg,def,tr,sz,color){
  if(!def||!def.content)return;
  const ns='http://www.w3.org/2000/svg';
  const o=document.createElementNS(ns,'g');o.setAttribute('transform',tr);
  const i=document.createElementNS(ns,'g');i.setAttribute('transform',vbt(def.vb,sz));
  i.innerHTML=applyColor(def.content,color);
  o.appendChild(i);pg.appendChild(o);
}

// ── 드래그 ──
let drag={active:false,cat:null,slotId:null,startSVG:{x:0,y:0},startPos:{x:0,y:0}};

function svgPoint(evt){
  const stage=document.getElementById('stage');
  const pt=stage.createSVGPoint();
  pt.x=evt.clientX; pt.y=evt.clientY;
  return pt.matrixTransform(stage.getScreenCTM().inverse());
}

// 각 파츠의 현재 월드 중심 계산
function partCenter(cat,slotId){
  if(cat==='frame') return {x:0,y:0};
  if(cat==='eye')   return {x:ST.eye.x,y:ST.eye.y};
  if(cat==='tail')  return {x:ST.tail.x,y:ST.tail.y};
  if(cat==='wing'){
    const slot=wingSlots.find(s=>s.id===slotId);
    if(!slot) return {x:0,y:0};
    const flip=slot.flip?-1:1;
    return {x:(DTX+slot.x)*flip, y:slot.y};
  }
  return {x:0,y:0};
}

function dist2(ax,ay,bx,by){return (ax-bx)**2+(ay-by)**2;}

function pickPart(svgX,svgY){
  // 각 파츠 중심과의 거리 중 가장 가까운 것 선택
  let best=null,bestD=Infinity;
  const THRESHOLD=80*80;

  // eye
  if(ST.eye.id!=='none'){
    const c={x:ST.eye.x,y:ST.eye.y};
    const d=dist2(svgX,svgY,c.x,c.y);
    if(d<bestD&&d<THRESHOLD){bestD=d;best={cat:'eye',slotId:null};}
  }
  // tail
  if(ST.tail.id!=='none'){
    const c={x:ST.tail.x,y:ST.tail.y};
    const d=dist2(svgX,svgY,c.x,c.y);
    if(d<bestD&&d<THRESHOLD){bestD=d;best={cat:'tail',slotId:null};}
  }
  // wings
  wingSlots.forEach(slot=>{
    if(slot.wingId==='none') return;
    const tx=DTX+slot.x, ty=slot.y;
    const d=dist2(svgX,svgY,tx,ty);
    if(d<bestD&&d<THRESHOLD*4){bestD=d;best={cat:'wing',slotId:slot.id};}
  });
  return best;
}

function onMouseDown(evt){
  if(evt.button!==0) return;
  const pt=svgPoint(evt);
  const hit=pickPart(pt.x,pt.y);
  if(!hit || hit.cat==='frame') return;
  drag.active=true;
  drag.cat=hit.cat;
  drag.slotId=hit.slotId;
  drag.startSVG={x:pt.x,y:pt.y};
  if(hit.cat==='eye')  drag.startPos={x:ST.eye.x,y:ST.eye.y};
  else if(hit.cat==='tail') drag.startPos={x:ST.tail.x,y:ST.tail.y};
  else if(hit.cat==='wing'){
    const slot=wingSlots.find(s=>s.id===hit.slotId);
    drag.startPos={x:slot.x,y:slot.y};
  } else {
    drag.startPos={x:0,y:0};
  }
  document.getElementById('stage').classList.add('drag-active');
  evt.preventDefault();
  // 선택 표시
  showIndicator(hit.cat,hit.slotId);
}

function onMouseMove(evt){
  if(!drag.active) return;
  const pt=svgPoint(evt);
  const dx=pt.x-drag.startSVG.x;
  const dy=pt.y-drag.startSVG.y;
  if(drag.cat==='eye'){
    ST.eye.x=Math.round(drag.startPos.x+dx);
    ST.eye.y=Math.round(drag.startPos.y+dy);
  } else if(drag.cat==='tail'){
    ST.tail.x=Math.round(drag.startPos.x+dx);
    ST.tail.y=Math.round(drag.startPos.y+dy);
  } else if(drag.cat==='wing'){
    const slot=wingSlots.find(s=>s.id===drag.slotId);
    if(slot){
      slot.x=Math.round(drag.startPos.x+dx);
      slot.y=Math.round(drag.startPos.y+dy);
    }
  }
  render();
}

function onMouseUp(){
  if(!drag.active) return;
  drag.active=false;
  document.getElementById('stage').classList.remove('drag-active');
}

// touch 지원
function onTouchStart(evt){
  const t=evt.touches[0];
  onMouseDown({button:0,clientX:t.clientX,clientY:t.clientY,preventDefault:()=>evt.preventDefault()});
}
function onTouchMove(evt){
  const t=evt.touches[0];
  onMouseMove({clientX:t.clientX,clientY:t.clientY});
  evt.preventDefault();
}

function showIndicator(cat,slotId){
  const el=document.getElementById('selected-indicator');
  const labels={frame:'Frame',eye:'Eye',tail:'Tail',wing:'Wing'};
  let label=labels[cat]||cat;
  if(cat==='wing'){
    const idx=wingSlots.findIndex(s=>s.id===slotId);
    if(wingSlots.length>1) label=`Wing ${idx+1}`;
  }
  el.textContent=`${label} 선택됨 · 드래그로 이동`;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),2000);
}

// ── 그리드 ──
function buildGrid(gId,parts,cat){
  const grid=document.getElementById(gId);if(!grid)return;
  grid.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  parts.forEach(p=>{
    const btn=document.createElement('button');
    btn.className='part-btn'+(ST[cat]&&ST[cat].id===p.id?' selected':'');
    if(!p.content){btn.innerHTML='<span style="font-family:\'DM Mono\',monospace;font-size:8px;color:#a09b93">없음</span>';}
    else{
      const s=document.createElementNS(ns,'svg');
      s.setAttribute('viewBox',`${p.vb[0]} ${p.vb[1]} ${p.vb[2]} ${p.vb[3]}`);
      s.innerHTML=applyColor(p.content,COLORS[cat]||'currentColor');
      btn.appendChild(s);
    }
    btn.onclick=()=>{
      ST[cat].id=p.id;buildGrid(gId,parts,cat);
      if(cat==='tail'){const h=p.id!=='none';document.getElementById('tail-sym-row').style.display=h?'block':'none';const a=document.getElementById('adjust-tail-area');if(a)a.style.display=h?'block':'none';}
      render();
    };
    grid.appendChild(btn);
  });
}
function setTailSym(v){ST.tail.symmetric=v;document.getElementById('tail-sym-off').classList.toggle('active',!v);document.getElementById('tail-sym-on').classList.toggle('active',v);render();}

// ── Wing slots ──
function buildWingSlots(){
  const c=document.getElementById('wing-slots');c.innerHTML='';
  const ns='http://www.w3.org/2000/svg';
  wingSlots.forEach((slot,idx)=>{
    const wrap=document.createElement('div');wrap.className='wing-slot';
    const hdr=document.createElement('div');hdr.className='wing-slot-hdr';
    const ttl=document.createElement('span');ttl.className='wing-slot-ttl';ttl.textContent=`Wing ${idx+1}`;
    const acts=document.createElement('div');acts.className='wing-slot-acts';
    if(wingSlots.length>1){const r=document.createElement('button');r.className='slot-btn rm';r.textContent='제거';r.onclick=e=>{e.stopPropagation();removeWingSlot(slot.id);};acts.appendChild(r);}
    const t=document.createElement('button');t.className='slot-btn';t.textContent=slot.open?'접기':'펼치기';
    t.onclick=e=>{e.stopPropagation();slot.open=!slot.open;buildWingSlots();};acts.appendChild(t);
    hdr.appendChild(ttl);hdr.appendChild(acts);hdr.onclick=()=>{slot.open=!slot.open;buildWingSlots();};wrap.appendChild(hdr);
    const body=document.createElement('div');body.className='wing-slot-body'+(slot.open?' open':'');
    const grid=document.createElement('div');grid.className='slot-parts-grid';
    WINGS.forEach(p=>{
      const btn=document.createElement('button');btn.className='part-btn'+(slot.wingId===p.id?' selected':'');
      if(!p.content){btn.innerHTML='<span style="font-family:\'DM Mono\',monospace;font-size:8px;color:#a09b93">없음</span>';}
      else{const s=document.createElementNS(ns,'svg');s.setAttribute('viewBox',`${p.vb[0]} ${p.vb[1]} ${p.vb[2]} ${p.vb[3]}`);s.innerHTML=applyColor(p.content,COLORS.wing);btn.appendChild(s);}
      btn.onclick=()=>{slot.wingId=p.id;buildWingSlots();render();};grid.appendChild(btn);
    });
    body.appendChild(grid);
    const fr=document.createElement('div');fr.className='ctrl-row';fr.innerHTML='<span class="ctrl-lbl">뒤집기</span>';
    const fg=document.createElement('div');fg.className='btn-group';
    ['오른쪽','왼쪽'].forEach((l,v)=>{const b=document.createElement('button');b.className='tog-btn'+(slot.flip===v?' active':'');b.textContent=l;b.onclick=()=>{slot.flip=v;buildWingSlots();render();};fg.appendChild(b);});
    fr.appendChild(fg);body.appendChild(fr);
    const sr=document.createElement('div');sr.className='ctrl-row';sr.style.marginTop='5px';sr.innerHTML='<span class="ctrl-lbl">배치</span>';
    const sg=document.createElement('div');sg.className='btn-group';
    [['한쪽',false],['대칭',true]].forEach(([l,v])=>{const b=document.createElement('button');b.className='tog-btn'+(slot.symmetric===v?' active':'');b.textContent=l;b.onclick=()=>{slot.symmetric=v;buildWingSlots();render();};sg.appendChild(b);});
    sr.appendChild(sg);body.appendChild(sr);wrap.appendChild(body);c.appendChild(wrap);
  });
  const ab=document.getElementById('add-wing-btn');ab.disabled=wingSlots.length>=3;ab.textContent=wingSlots.length>=3?'날개 최대 3쌍':'+ 날개 추가';
}
function addWingSlot(){if(wingSlots.length>=3)return;wingSlots.push({id:nextSlotId++,wingId:WINGS[1+Math.floor(Math.random()*(WINGS.length-1))].id,x:0,y:-15*wingSlots.length,scale:DWS,rot:0,flip:0,symmetric:false,open:true});buildWingSlots();renderAdjustWings();render();}
function removeWingSlot(id){wingSlots=wingSlots.filter(s=>s.id!==id);buildWingSlots();renderAdjustWings();render();}

// ── 조정 탭 (크기·회전만) ──
function renderAdjustWings(){
  const a=document.getElementById('adjust-wings-area');if(!a)return;a.innerHTML='';
  wingSlots.forEach((slot,idx)=>{
    const g=document.createElement('div');g.className='ctrl-group';
    g.innerHTML=`<div class="cat-label" style="margin-bottom:8px;">Wing ${idx+1}</div>
    <div class="ctrl-row"><span class="ctrl-lbl">크기</span><input type="range" min="40" max="250" value="${slot.scale}" step="1" oninput="uwc(${slot.id},'scale',this.value)"/><span class="ctrl-val" id="wc-${slot.id}-scale">${slot.scale}%</span></div>
    <div class="ctrl-row"><span class="ctrl-lbl">회전</span><input type="range" min="-180" max="180" value="${slot.rot}" step="1" oninput="uwc(${slot.id},'rot',this.value)"/><span class="ctrl-val" id="wc-${slot.id}-rot">${slot.rot}°</span></div>`;
    a.appendChild(g);
  });
}
function uwc(id,prop,val){val=parseFloat(val);const s=wingSlots.find(s=>s.id===id);if(!s)return;s[prop]=val;const el=document.getElementById(`wc-${id}-${prop}`);if(el)el.textContent=prop==='scale'?val+'%':prop==='rot'?val+'°':val+'';render();}
function utc(prop,val){val=parseFloat(val);ST.tail[prop]=val;const el=document.getElementById(`tail-${prop}-val`);if(el)el.textContent=prop==='scale'?val+'%':prop==='rot'?val+'°':val+'';render();}
function uc(cat,prop,val){val=parseFloat(val);ST[cat][prop]=val;const el=document.getElementById(`${cat}-${prop}-val`);if(el)el.textContent=prop==='scale'?Math.round(val)+'%':prop==='rot'?Math.round(val)+'°':Math.round(val)+'';render();}

// ── 렌더 ──
function render(){
  const ns='http://www.w3.org/2000/svg';
  ['g-wings','g-tail','g-frame','g-eye'].forEach(id=>document.getElementById(id).innerHTML='');

  // Wings — 모든 슬롯 렌더
  wingSlots.forEach(slot=>{
    const def=WINGS.find(p=>p.id===slot.wingId);if(!def||!def.content)return;
    const sc=slot.scale/100,flip=slot.flip?-1:1,tx=DTX+slot.x,ty=slot.y;
    rpColored(document.getElementById('g-wings'),def,`translate(${tx},${ty}) rotate(${slot.rot}) scale(${flip*sc},${sc})`,100,COLORS.wing);
    if(slot.symmetric) rpColored(document.getElementById('g-wings'),def,`translate(${-tx},${ty}) rotate(${-slot.rot}) scale(${-flip*sc},${sc})`,100,COLORS.wing);
  });

  // Tail
  const td=TAILS.find(p=>p.id===ST.tail.id);
  if(td&&td.content){
    const t=ST.tail,sc=t.scale/100;
    rpColored(document.getElementById('g-tail'),td,`translate(${t.x},${t.y}) rotate(${t.rot}) scale(${sc})`,40,COLORS.tail);
    if(t.symmetric) rpColored(document.getElementById('g-tail'),td,`translate(${-t.x},${t.y}) rotate(${-t.rot}) scale(${-sc},${sc})`,40,COLORS.tail);
  }

  // Frame
  const fd=FRAMES.find(p=>p.id===ST.frame.id);
  if(fd&&fd.content) rpColored(document.getElementById('g-frame'),fd,`scale(${ST.frame.scale/100})`,120,COLORS.frame);

  // Eye
  const ed=EYES.find(p=>p.id===ST.eye.id);
  if(ed&&ed.content){const e=ST.eye;rpColored(document.getElementById('g-eye'),ed,`translate(${e.x},${e.y}) rotate(${e.rot}) scale(${e.scale/100})`,50,COLORS.eye);}
}

// ── LOUNGE ──
function renderLounge(){
  const grid=document.getElementById('lounge-grid');
  grid.innerHTML='';
  document.getElementById('lounge-sub').textContent=
    loungeItems.length>0?`${loungeItems.length}개의 Lightkeeper가 모여있어요`:'라운지에 저장된 Lightkeeper들을 만나보세요';
  if(loungeItems.length===0){
    grid.innerHTML='<div class="lounge-empty">아직 저장된 Lightkeeper가 없어요.<br>Builder에서 캐릭터를 만들고 라운지에 저장해보세요!</div>';
    return;
  }
  const ns='http://www.w3.org/2000/svg';
  const durs=[3.0,3.4,3.8,4.2,2.8,3.6,4.0,3.2];
  const delays=[0,0.6,1.2,0.3,1.8,0.9,0.4,1.5];
  loungeItems.forEach((item,idx)=>{
    const card=document.createElement('div');card.className='lounge-card';
    const cv=document.createElement('div');cv.className='lounge-card-cv';
    const fw=document.createElement('div');fw.className='float-wrap';
    fw.style.setProperty('--dur',`${durs[idx%durs.length]}s`);
    fw.style.setProperty('--delay',`${delays[idx%delays.length]}s`);
    const svg=document.createElementNS(ns,'svg');
    svg.setAttribute('width','140');svg.setAttribute('height','140');
    svg.setAttribute('viewBox','-180 -180 360 360');svg.style.overflow='visible';
    svg.innerHTML=item.svgInner;
    fw.appendChild(svg);cv.appendChild(fw);
    cv.onclick=()=>openViewModal(item);
    const info=document.createElement('div');info.className='lounge-card-info';
    info.innerHTML=`<div class="lounge-card-name">${item.creator}의 Lightkeeper</div><div class="lounge-card-date">${item.createdAt}</div>`;
    const foot=document.createElement('div');foot.className='lounge-card-foot';
    const del=document.createElement('button');del.className='del-btn';del.textContent='삭제';
    del.onclick=e=>{e.stopPropagation();if(confirm('이 Lightkeeper를 삭제할까요?')){deleteItem(item.id);}};
    foot.appendChild(del);
    card.appendChild(cv);card.appendChild(info);card.appendChild(foot);
    grid.appendChild(card);
  });
}

function deleteItem(id){loungeItems=loungeItems.filter(i=>i.id!==id);saveStorage();updateCount();renderLounge();}
function openViewModal(item){
  viewingItem=item;
  document.getElementById('view-stage').innerHTML=item.svgInner;

  document.getElementById('view-date').textContent=item.createdAt;

function exportFromView(){
  if(!viewingItem)return;
  const blob=new Blob([`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-180 -180 360 360">${viewingItem.svgInner}</svg>`],{type:'image/svg+xml'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`lightkeeper-${viewingItem.creator}.svg`;a.click();
}

function randomize(){
  ST.frame.id=FRAMES[1+Math.floor(Math.random()*(FRAMES.length-1))].id;
  ST.eye.id=EYES[1+Math.floor(Math.random()*(EYES.length-1))].id;
  ST.tail.id='none';
  wingSlots=[{id:0,wingId:WINGS[1+Math.floor(Math.random()*(WINGS.length-1))].id,x:Math.floor(Math.random()*15),y:-(Math.floor(Math.random()*20)+10),scale:DWS,rot:0,flip:0,symmetric:false,open:true}];
